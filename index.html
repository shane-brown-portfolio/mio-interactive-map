<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIO: Memories in Orbit Tracker</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/progress-bar.css">
  <link rel="stylesheet" href="styles/sidebar.css">
  <link rel="stylesheet" href="styles/map.css">
  <link rel="stylesheet" href="styles/pins.css">
  <link rel="stylesheet" href="styles/popup.css">
</head>

<body>
  <header>
    <h1>MIO: Memories in Orbit Tracker</h1>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 / 0</div>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <div class="side-section">
        <h2>Display</h2>
        <label class="toggle-row">
          <span>Show collected pins</span>
          <span class="switch">
            <input type="checkbox" id="showCollected">
            <span class="track"><span class="knob"></span></span>
          </span>
        </label>
        <div class="global-actions">
          <button type="button" id="showAllTypes">Show all pins</button>
          <button type="button" id="hideAllTypes">Hide all pins</button>
        </div>
      </div>
      <div class="side-section">
        <h2>Item Types</h2>
        <div id="categoryList"></div>
      </div>
      <div class="side-section">
        <button type="button" id="resetProgress" class="reset-btn">Reset all progress</button>
      </div>
    </aside>

    <main>
      <div class="viewport" id="viewport">
        <div class="world" id="world">
          <img class="basemap" id="basemap" alt="Mio: Memories in Orbit Map" draggable="false">
        </div>
      </div>
      <div class="zoom-controls">
        <button id="zoomIn" title="Zoom in">+</button>
        <button id="zoomOut" title="Zoom out">&minus;</button>
        <button id="zoomReset" title="Reset view">&#8634;</button>
      </div>
      <div class="popup" id="popup">
        <button class="popup-close" id="popupClose" title="Close">&times;</button>
        <div class="popup-type" id="popupType"></div>
        <h3 id="popupTitle"></h3>
        <div id="popupDesc"></div>
        <button class="popup-complete" id="popupComplete">Mark completed</button>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="scripts/pins.js"></script>
  <script src="scripts/progress.js"></script>
  <script src="scripts/sidebar.js"></script>
  <script src="scripts/popup.js"></script>
  <script src="scripts/viewport.js"></script>
</body>

</html>
